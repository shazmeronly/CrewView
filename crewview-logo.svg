<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-label="CrewView — Your roster. Your time. Your view.">
  <defs>
    <linearGradient id="cvLogoGradient" x1="36" y1="174" x2="176" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D6EFD"/>
      <stop offset="0.52" stop-color="#159CFF"/>
      <stop offset="1" stop-color="#22C6FF"/>
    </linearGradient>
    <linearGradient id="cvViewGradient" x1="430" y1="58" x2="700" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C6FF"/>
      <stop offset="1" stop-color="#0D6EFD"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(18 18) scale(1.75)">
    <path d="M79 20 C65 9 45 8 30 16 C12 25 6 47 14 65 C22 84 43 94 62 88 C69 86 75 82 80 77"
          fill="none" stroke="url(#cvLogoGradient)" stroke-width="14" stroke-linecap="round"/>
    <path d="M20 78 L48 60" fill="none" stroke="#0D6EFD" stroke-width="4.1" stroke-linecap="round"/>
    <path d="M24 84 L51 63" fill="none" stroke="#159CFF" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M30 89 L54 66" fill="none" stroke="#22C6FF" stroke-width="2.7" stroke-linecap="round"/>
    <path d="M54 44 L77 32 C79 31 81 31.5 82 33 L83 35 L72 46 L84 50 L81 54 L67 52 L61 67 L57 65 L59 51 L47 47 L50 43 Z"
          fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="220" y="126"
        font-family="Inter, SF Pro Display, Arial, sans-serif"
        font-size="91" font-weight="780" letter-spacing="-4"
        fill="#FFFFFF">Crew</text>
  <text x="430" y="126"
        font-family="Inter, SF Pro Display, Arial, sans-serif"
        font-size="91" font-weight="820" letter-spacing="-4"
        fill="url(#cvViewGradient)">View</text>

  <!-- Tagline -->
  <line x1="248" y1="164" x2="284" y2="164" stroke="#159CFF" stroke-width="2.5"/>
  <text x="298" y="171"
        font-family="Inter, SF Pro Text, Arial, sans-serif"
        font-size="18" font-weight="520" letter-spacing="4"
        fill="#D6E5F5">YOUR ROSTER. YOUR TIME. YOUR VIEW.</text>
  <line x1="718" y1="164" x2="754" y2="164" stroke="#159CFF" stroke-width="2.5"/>
</svg>