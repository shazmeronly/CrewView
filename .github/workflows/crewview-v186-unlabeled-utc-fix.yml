name: CrewView v186 unlabeled UTC roster fix

on:
  push:
    branches:
      - fix/unlabeled-utc-roster-v186

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch UTC detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          old=r'''function detectRosterTimeBasis(rows,pdfText){
  const text=String(pdfText||"");
  // Use an explicit label when the exporter includes one.
  if(/(?:^|\s)SLT(?:\s|$)/i.test(text)) return "SLT";
  if(/(?:^|\s)UTC(?:\s|$)|\bZULU\b/i.test(text)) return "UTC";

  let localEvidence=0, fixedEvidence=0;
  (rows||[]).forEach(row=>{
    if(!/^MH\d+/i.test(String(row?.item||""))) return;
    const block=toMinutes(row?.block);
    if(!(block>0)) return;
    const fixed=fixedClockElapsedMinutes(row.dep,row.arr);
    const local=localClockElapsedMinutes(row);
    if(!Number.isFinite(fixed)||!Number.isFinite(local)) return;
    const fixedErr=Math.abs(fixed-block);
    const localErr=Math.abs(local-block);
    // Only count a sample when the timezone interpretation clearly separates.
    if(localErr<=4 && fixedErr>=20) localEvidence++;
    if(fixedErr<=4 && localErr>=20) fixedEvidence++;
  });

  // iFlight SLT means each station's local clock, so timezone-aware elapsed
  // time matches the published block time on cross-zone sectors.
  if(localEvidence>fixedEvidence && localEvidence>0) return "SLT";

  /*
   * iFlight LT is a single local reference (the crew/base local clock), so
   * simple wall-clock subtraction matches block time. UTC is also fixed-zone;
   * therefore an unlabeled UTC PDF is mathematically indistinguishable from
   * LT from the rows alone. Explicit UTC labels are handled above.
   */
  if(fixedEvidence>0) return "LT";
  return "LT";
}
'''
          new=r'''function detectRosterTimeBasis(rows,pdfText){
  const text=String(pdfText||"");
  // Use an explicit label when the exporter includes one.
  if(/(?:^|\s)SLT(?:\s|$)/i.test(text)) return "SLT";
  if(/(?:^|\s)UTC(?:\s|$)|\bZULU\b/i.test(text)) return "UTC";

  /*
   * iFlight can export a UTC roster without printing the word "UTC". Flight
   * elapsed times alone cannot distinguish that from base-local LT because
   * both are fixed-clock systems. Full-day OFF/DO rows give us a reliable
   * calendar anchor instead: a base-local midnight is printed at its UTC
   * equivalent (for KUL, 16:00 on the preceding UTC date).
   *
   * Require at least two such anchors so one unusual ground-duty time cannot
   * reclassify an LT roster. This is what keeps 31-Aug MH388 on operational
   * 01-Sep while moving 30-Sep MH144 to operational 01-Oct.
   */
  const base=baseAirportCode();
  const baseZone=airportTimezone(base);
  let utcCalendarAnchors=0;

  (rows||[]).forEach(row=>{
    const item=String(row?.item||"").trim().toUpperCase();
    if(!["D","DO","DO1","OFF"].includes(item)) return;

    const sourceDate=String(row?._sourceDate||row?.date||"").trim();
    const sourceTime=String(row?._sourceDutyStart||row?.dutyStart||"").trim();
    const date=rosterDateComponents(sourceDate);
    const time=sourceTime.match(/(\d{1,2}):(\d{2})/);
    if(!date||!time) return;

    const utcMs=Date.UTC(
      date.year,date.month-1,date.day,
      Number(time[1]),Number(time[2]),0,0
    );
    const local=timePartsInZone(utcMs,baseZone);
    if(local?.hour==="00" && local?.minute==="00") utcCalendarAnchors++;
  });

  if(utcCalendarAnchors>=2) return "UTC";

  let localEvidence=0, fixedEvidence=0;
  (rows||[]).forEach(row=>{
    if(!/^MH\d+/i.test(String(row?.item||""))) return;
    const block=toMinutes(row?.block);
    if(!(block>0)) return;
    const fixed=fixedClockElapsedMinutes(row.dep,row.arr);
    const local=localClockElapsedMinutes(row);
    if(!Number.isFinite(fixed)||!Number.isFinite(local)) return;
    const fixedErr=Math.abs(fixed-block);
    const localErr=Math.abs(local-block);
    // Only count a sample when the timezone interpretation clearly separates.
    if(localErr<=4 && fixedErr>=20) localEvidence++;
    if(fixedErr<=4 && localErr>=20) fixedEvidence++;
  });

  // iFlight SLT means each station's local clock, so timezone-aware elapsed
  // time matches the published block time on cross-zone sectors.
  if(localEvidence>fixedEvidence && localEvidence>0) return "SLT";

  // Remaining fixed-clock rosters are ordinary base-local LT.
  if(fixedEvidence>0) return "LT";
  return "LT";
}
'''
          if s.count(old)!=1:
              raise SystemExit(f'detectRosterTimeBasis block match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          index=Path('index.html')
          t=index.read_text()
          if '?v=185' not in t:
              raise SystemExit('index v185 marker not found')
          index.write_text(t.replace('?v=185','?v=186'))

          sw=Path('sw.js')
          t=sw.read_text()
          if 'crewview-v185' not in t:
              raise SystemExit('service worker v185 cache marker not found')
          sw.write_text(t.replace('crewview-v185','crewview-v186').replace('?v=185','?v=186'))
          PY

      - name: Add time-basis regression test
        shell: bash
        run: |
          cat > tests/unlabeled-utc-basis.cjs <<'EOF'
          const fs=require('node:fs');
          const vm=require('node:vm');
          const assert=require('node:assert/strict');
          const path=require('node:path');

          const source=fs.readFileSync(path.join(__dirname,'..','app.js'),'utf8');
          const functions=source.match(/^function [^\n]+\{[^\n]*\}$|^function [^\n]+\{\n[\s\S]*?^\}/gm).join('\n');
          const ctx=vm.createContext({
            console,Intl,Date,Map,Set,
            AIRPORT_TIMEZONES:{KUL:'Asia/Kuala_Lumpur',PVG:'Asia/Shanghai',AKL:'Pacific/Auckland'},
            $:()=>({value:'KUL'}),
            rosterTimeBasis:'LT'
          });
          vm.runInContext(functions,ctx);

          ctx.utcRows=[
            {date:'31-Aug-2026',_sourceDate:'31-Aug-2026',dutyStart:'23:30',_sourceDutyStart:'23:30',item:'MH388',dep:'KUL 00:50(+1)',arr:'PVG 06:29(+1)',block:'0:00',duty:'07:44'},
            {date:'02-Sep-2026',_sourceDate:'02-Sep-2026',dutyStart:'',_sourceDutyStart:'16:00',item:'D',dep:'',arr:''},
            {date:'08-Sep-2026',_sourceDate:'08-Sep-2026',dutyStart:'',_sourceDutyStart:'16:00',item:'D',dep:'',arr:''},
            {date:'30-Sep-2026',_sourceDate:'30-Sep-2026',dutyStart:'23:50',_sourceDutyStart:'23:50',item:'MH144',dep:'AKL 00:50(+1)',arr:'KUL 12:30(+1)',block:'0:00',duty:'13:25'}
          ];
          assert.equal(vm.runInContext('detectRosterTimeBasis(utcRows,"")',ctx),'UTC');

          ctx.rosterTimeBasis='UTC';
          ctx.rows=vm.runInContext('annotateOperationalDates(utcRows)',ctx);
          assert.equal(ctx.rows[0].date,'01-Sep-2026');
          assert.equal(ctx.rows[3].date,'01-Oct-2026');

          ctx.localRows=[
            {date:'03-Sep-2026',_sourceDate:'03-Sep-2026',dutyStart:'',_sourceDutyStart:'00:00',item:'D',dep:'',arr:''},
            {date:'10-Sep-2026',_sourceDate:'10-Sep-2026',dutyStart:'',_sourceDutyStart:'00:00',item:'D',dep:'',arr:''},
            {date:'28-Sep-2026',_sourceDate:'28-Sep-2026',dutyStart:'20:15',_sourceDutyStart:'20:15',item:'MH145',dep:'KUL 21:30',arr:'AKL 12:25(+1)',block:'06:36',duty:'11:55'}
          ];
          ctx.rosterTimeBasis='LT';
          assert.equal(vm.runInContext('detectRosterTimeBasis(localRows,"")',ctx),'LT');
          console.log('PASS: unlabeled UTC calendar anchors detected; normal KUL LT roster remains LT');
          EOF

      - name: Run regression checks
        shell: bash
        run: |
          node --check app.js
          node tests/unlabeled-utc-basis.cjs
          node tests/operational-date-boundary.cjs
          node tests/source-total-notices.cjs
          node tests/operational-roster-sync.cjs

      - name: Commit tested fix
        shell: bash
        run: |
          rm -f .github/workflows/crewview-v186-unlabeled-utc-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Detect unlabeled UTC rosters (v186)"
          git push origin HEAD:fix/unlabeled-utc-roster-v186
