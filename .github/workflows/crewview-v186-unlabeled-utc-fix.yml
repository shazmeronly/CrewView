name: CrewView v186 unlabeled UTC roster fix

on:
  push:
    branches:
      - fix/unlabeled-utc-roster-v186

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/v186_patch.py
      - name: Run regression checks
        run: |
          node --check app.js
          node tests/unlabeled-utc-basis.cjs
          node tests/operational-date-boundary.cjs
          node tests/source-total-notices.cjs
          node tests/operational-roster-sync.cjs
      - name: Commit tested fix
        run: |
          rm -f .github/workflows/crewview-v186-unlabeled-utc-fix.yml .github/v186_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Detect unlabeled UTC rosters (v186)"
          git push origin HEAD:fix/unlabeled-utc-roster-v186
