name: CrewView v187 cached UTC reclassification

on:
  push:
    branches:
      - fix/reclassify-cached-utc-v187

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch cached roster restore
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          s=p.read_text()
          old='''  officialFH=cached.officialFH||null;\n  officialDH=cached.officialDH||null;\n  officialRosterPeriod=deserializeRosterPeriod(cached.officialRosterPeriod);\n  rosterTimeBasis=["LT","SLT","UTC"].includes(cached.rosterTimeBasis) ? cached.rosterTimeBasis : "LT";\n  Object.entries(cached.profile||{}).forEach(([id,value])=>{\n    const input=$("#"+id);\n    if(input) input.value=value||"";\n  });\n\n  setRows(annotateOperationalDates(cached.rows));\n'''
          new='''  officialFH=cached.officialFH||null;\n  officialDH=cached.officialDH||null;\n  officialRosterPeriod=deserializeRosterPeriod(cached.officialRosterPeriod);\n  Object.entries(cached.profile||{}).forEach(([id,value])=>{\n    const input=$("#"+id);\n    if(input) input.value=value||"";\n  });\n\n  const storedTimeBasis=["LT","SLT","UTC"].includes(cached.rosterTimeBasis)\n    ? cached.rosterTimeBasis\n    : "LT";\n  rosterTimeBasis=storedTimeBasis;\n\n  // v185 could save an unlabeled UTC iFlight roster as LT. Re-run the new\n  // calendar-anchor detector on cached rows so existing users are repaired\n  // immediately after deployment without having to clear or re-upload first.\n  if(storedTimeBasis==="LT"){\n    const redetected=detectRosterTimeBasis(cached.rows,"");\n    if(redetected==="UTC") rosterTimeBasis="UTC";\n  }\n\n  setRows(annotateOperationalDates(cached.rows));\n'''
          if s.count(old)!=1:
              raise SystemExit(f'restore block match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          index=Path('index.html')
          t=index.read_text()
          if '?v=186' not in t:
              raise SystemExit('index v186 marker not found')
          index.write_text(t.replace('?v=186','?v=187'))

          sw=Path('sw.js')
          t=sw.read_text()
          if 'crewview-v186' not in t:
              raise SystemExit('service worker v186 marker not found')
          sw.write_text(t.replace('crewview-v186','crewview-v187').replace('?v=186','?v=187'))
          PY
      - name: Run regression checks
        run: |
          node --check app.js
          node tests/unlabeled-utc-basis.cjs
          node tests/operational-date-boundary.cjs
          node tests/source-total-notices.cjs
          node tests/operational-roster-sync.cjs
      - name: Commit tested fix
        run: |
          rm -f .github/workflows/crewview-v187-cache-reclassify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reclassify cached unlabeled UTC rosters (v187)"
          git push origin HEAD:fix/reclassify-cached-utc-v187
