name: CrewView v185 operational-date fix

on:
  push:
    branches:
      - fix/operational-date-month-boundary-v185

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/crewview-v185-patch.py
      - name: Run regression checks
        run: |
          node --check app.js
          node tests/operational-date-boundary.cjs
          node tests/source-total-notices.cjs
          node tests/operational-roster-sync.cjs
      - name: Commit tested fix
        run: |
          rm -f .github/workflows/crewview-v185-operational-date-fix.yml .github/crewview-v185-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix operational date month boundaries (v185)"
          git push origin HEAD:fix/operational-date-month-boundary-v185
